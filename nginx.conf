# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — Reverse Proxy Configuration
#
# Traffic flow:
#   Browser (any port) → Nginx :80 → Spring Boot container :8080
#
# Nginx sits in front of the Spring Boot app so that:
#   1. Clients always talk to a standard HTTP port (80).
#   2. Nginx can handle SSL termination, caching, rate-limiting etc. later.
#   3. The Spring Boot service is not directly exposed to the internet.
# ─────────────────────────────────────────────────────────────────────────────

# Number of worker processes (auto = one per CPU core)
worker_processes auto;

events {
    # Maximum simultaneous connections per worker
    worker_connections 1024;
}

http {

    # ── Upstream definition ─────────────────────────────────────────────────
    # "springboot-app" matches the service name declared in docker-compose.yml.
    # Docker's internal DNS resolves it to the Spring Boot container's IP.
    upstream springboot_backend {
        server springboot-app:8080;
    }

    # ── Virtual server ───────────────────────────────────────────────────────
    server {
        listen 80;                        # Listen for incoming HTTP traffic
        server_name localhost;            # Hostname (update to your domain in prod)

        # ── Proxy all requests to Spring Boot ────────────────────────────────
        location / {
            proxy_pass http://springboot_backend;

            # Forward the original Host header so Spring Boot can use it
            proxy_set_header Host              $host;

            # Forward the real client IP address
            proxy_set_header X-Real-IP         $remote_addr;

            # Forward the chain of proxies (useful for logging / security)
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Tell Spring Boot the original protocol (http or https)
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts — increase these for long-running requests
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }
    }
}
