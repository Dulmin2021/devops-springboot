# ─────────────────────────────────────────────
# Spring Boot Application Configuration
# ─────────────────────────────────────────────

spring:
  application:
    name: springboot-devops          # Application name shown in logs/metrics

server:
  port: 8080                         # Port the embedded Tomcat listens on

# ─────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.dulmin.cicd_demo: DEBUG      # Verbose logging for our own package
