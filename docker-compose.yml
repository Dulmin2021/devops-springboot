# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Local development & production deployment
#
# Services:
#   springboot-app  → The packaged Java application (port 8080)
#   nginx           → Reverse proxy that fronts the app (port 80)
#
# Usage:
#   docker compose up --build -d      # Start everything
#   docker compose down               # Stop and remove containers
#   docker compose logs -f            # Stream logs
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ── Spring Boot Application ────────────────────────────────────────────────
  springboot-app:
    build:
      context: .          # Dockerfile is in the project root
      dockerfile: Dockerfile
    image: springboot-devops:latest   # Tag the built image
    container_name: springboot-app
    ports:
      - "8080:8080"       # Expose Spring Boot directly (useful for debugging)
    networks:
      - devops-network
    restart: unless-stopped           # Auto-restart unless manually stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s   # Give Spring Boot time to start before checking

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:stable-alpine        # Lightweight production-ready Nginx image
    container_name: nginx-proxy
    ports:
      - "80:80"           # Main entry point for all external traffic
    volumes:
      # Mount our custom nginx.conf over the default one
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      springboot-app:
        condition: service_healthy    # Wait until Spring Boot passes health check
    networks:
      - devops-network
    restart: unless-stopped

# ── Shared Network ─────────────────────────────────────────────────────────
networks:
  devops-network:
    driver: bridge                    # Default bridge network for container-to-container comms
